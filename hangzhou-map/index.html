  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f7f5">
  <title>杭州 · 城市区域底图</title>
  <style>
    :root{color-scheme:light;--paper:#f3f7f5;--ink:#27444b;--muted:#6c8589;--water:#c9e5eb;--line:#718d92;--focus:#507d85}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{min-height:100svh;overflow-x:hidden;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(ellipse at 52% 44%,rgba(187,222,225,.23),transparent 50%),linear-gradient(145deg,#f8faf8,#edf4f2 72%,#f4f7f5)}
    .page{width:min(1320px,100%);min-height:100svh;margin:auto;padding:26px clamp(18px,4vw,60px) 20px;display:flex;flex-direction:column}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:none}
    .back{color:#668187;text-decoration:none;font-size:13px;letter-spacing:.04em}.back:hover{color:#315e66}
    .heading{text-align:center;flex:1}.eyebrow{margin:0 0 6px;color:#789296;font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.2em}.heading h1{margin:0;color:#2f5158;font-size:clamp(22px,2.5vw,32px);font-weight:500;letter-spacing:.14em}.heading p{margin:7px 0 0;color:#7d9294;font-size:12px;letter-spacing:.06em}
    .spacer{width:115px;flex:none}
    .map-stage{position:relative;flex:1;min-height:500px;display:grid;place-items:center;perspective:1450px;isolation:isolate}
    .map-stage:before{content:"";position:absolute;width:min(70vw,760px);height:70px;left:50%;bottom:14%;transform:translateX(-50%);border-radius:50%;background:rgba(76,119,126,.09);filter:blur(22px);z-index:-1}
    #hangzhouMap{display:block;width:min(88%,1080px);height:min(76svh,740px);overflow:visible;transform:perspective(1450px) rotateX(30deg) rotateZ(-7deg) scale(.94);transform-origin:50% 52%;filter:drop-shadow(0 16px 14px rgba(69,105,111,.1));transition:transform .5s ease}
    .district{fill:var(--water);stroke:rgba(248,252,251,.94);stroke-width:1.3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .district.is-focus{stroke:rgba(248,252,251,.94);stroke-width:1.3}
    .district-label{fill:#345a62;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:rgba(245,249,247,.97);stroke-width:4px;stroke-linejoin:round;letter-spacing:.08em;pointer-events:none}
    .region-pin{fill:#47747d;stroke:#eef6f4;stroke-width:2;vector-effect:non-scaling-stroke}
    .map-status{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);color:#829699;font-size:11px;letter-spacing:.08em;white-space:nowrap}
    .page-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;border-top:1px solid rgba(100,137,143,.18);color:#809396;font-size:10px;line-height:1.6}

<body>
  <main class="page">
    <section class="map-stage" aria-label="杭州市行政区地图">
      <svg id="hangzhouMap" viewBox="0 0 1000 660" role="img" aria-labelledby="mapTitle mapDescription" preserveAspectRatio="xMidYMid meet">
        <title id="mapTitle">杭州市行政区地图</title>
        <desc id="mapDescription">杭州市浅蓝色行政区边界底图，不含区名标注或数据图层。</desc>
        <g id="districtLayer"></g>
      </svg>
    </section>
  </main>
  <script>
    (()=>{
      const focusNames=new Set(['上城区','西湖区','余杭区','拱墅区']);
      const districtLayer=document.getElementById('districtLayer');
      const allPoints=[];
      const walkCoordinates=(coordinates,visit)=>{if(typeof coordinates[0]==='number'){visit(coordinates);return;}coordinates.forEach(child=>walkCoordinates(child,visit));};
      const projector=(coord,bounds,scale,offsetX,offsetY,cosLat)=>[offsetX+(coord[0]*cosLat-bounds.minX)*scale,offsetY+(bounds.maxY-coord[1])*scale];
      const ringsToPath=(geometry,point)=>{
        const polygons=geometry.type==='Polygon'?[geometry.coordinates]:geometry.coordinates;
        return polygons.flatMap(polygon=>polygon.map(ring=>ring.map((coord,index)=>{
          const [x,y]=point(coord);return `${index?'L':'M'}${x.toFixed(2)} ${y.toFixed(2)}`;
        }).join(' ')+' Z')).join(' ');
      };
      const ns='http://www.w3.org/2000/svg';
      const pathFor=(feature,bounds,scale,offsetX,offsetY,cosLat)=>{
        const path=document.createElementNS(ns,'path');path.setAttribute('d',ringsToPath(feature.geometry,coord=>projector(coord,bounds,scale,offsetX,offsetY,cosLat)));path.setAttribute('class','district'+(focusNames.has(feature.properties.name)?' is-focus':''));path.setAttribute('fill-rule','evenodd');path.setAttribute('aria-label',feature.properties.name);return path;
      };
      fetch('./hangzhou-districts.geojson').then(response=>{if(!response.ok)throw Error('map data');return response.json();}).then(data=>{
        data.features.forEach(feature=>walkCoordinates(feature.geometry.coordinates,coord=>allPoints.push(coord)));
        const cosLat=Math.cos(30.2*Math.PI/180),xs=allPoints.map(coord=>coord[0]*cosLat),ys=allPoints.map(coord=>coord[1]);
        const bounds={minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)};
        const scale=Math.min(850/(bounds.maxX-bounds.minX),570/(bounds.maxY-bounds.minY));
        const offsetX=(1000-(bounds.maxX-bounds.minX)*scale)/2,offsetY=(660-(bounds.maxY-bounds.minY)*scale)/2;
        const point=coord=>projector(coord,bounds,scale,offsetX,offsetY,cosLat);
        data.features.forEach(feature=>districtLayer.append(pathFor(feature,bounds,scale,offsetX,offsetY,cosLat)));
      }).catch(()=>{});
    })();
  </script>
